services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coolshield
      POSTGRES_USER: coolshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password-change-me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coolshield -d coolshield"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build: .
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    env_file: .env
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  ingestion-api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  mqtt-worker:
    build: .
    command: python mqtt_worker.py
    env_file: .env
    depends_on:
      - db
      - mosquitto
    profiles: ["iot"]
    volumes:
      - .:/app

volumes:
  pgdata:
